name: Backup contract
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-harmony-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/backup-contract/package-lock.json
      - run: npm ci --prefix scripts/backup-contract --ignore-scripts
      - run: python3 tools/lan-v2-probe/test_build.py
      - run: python3 scripts/check-lan-quarantine.py
      - run: node scripts/backup-contract/generate-cases.cjs --check
      - run: node scripts/backup-contract/generate-encrypted.cjs --check
      - run: node --test scripts/backup-contract/contract.test.cjs harmonyos/tests/*.test.cjs
        env:
          FLASH_TYPESCRIPT_PATH: ${{ github.workspace }}/scripts/backup-contract/node_modules/typescript
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 已预装 Android SDK 且许可已接受；setup-android v3 在 2026-09 后的
      # runner 镜像上安装 tools 即失败，故移除。
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain
        working-directory: android
  android-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build FlashLAN JNI for the x86_64 instrumentation target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 x86_64-linux-android
          sdkmanager "ndk;29.0.14206865"
          curl --fail --location --retry 3 \
            https://download.libsodium.org/libsodium/releases/libsodium-1.0.22.tar.gz \
            --output "$RUNNER_TEMP/libsodium-1.0.22.tar.gz"
          # The existing builder validates the pinned sodium SHA-256 and links
          # the real JNI bridge. Cargo fetch uses the checked-in lockfile.
          (cd shared/FlashLAN && cargo fetch --locked --target x86_64-linux-android)
          python3 tools/lan-v2-probe/build.py --core --target android-x86_64 \
            --sodium-archive "$RUNNER_TEMP/libsodium-1.0.22.tar.gz" \
            --android-ndk "$ANDROID_HOME/ndk/29.0.14206865" \
            --output "$RUNNER_TEMP/flash-lan-build"
          # CI-only debug payload: do not create a partial release artifact set
          # or change the disabled production gate.
          install -D "$RUNNER_TEMP/flash-lan-build/android-x86_64/libflash_lan.so" \
            android/app/src/debug/jniLibs/x86_64/libflash_lan.so
      - name: Verify JNI is packaged in the debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --console=plain
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/x86_64/libflash_lan.so'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
  macos:
    # 代码使用 Xcode 27（Swift 6.2 工具链）编译，本地验证环境同为 Xcode 27.0 beta；
    # macos-15 默认 Xcode 16 会报并发编译错误。xcode-27 镜像默认 Xcode 27.0（build 27A5218g）。
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild test -scheme Flash -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: macos
      - run: swift test --package-path shared/FlashKit
      - name: iOS simulator compilation (no signing)
        run: xcodebuild -project ios/Flash.xcodeproj -scheme Flash -destination 'generic/platform=iOS Simulator' build-for-testing CODE_SIGNING_ALLOWED=NO

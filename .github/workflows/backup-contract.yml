name: Backup contract
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-harmony-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/backup-contract/package-lock.json
      - run: npm ci --prefix scripts/backup-contract --ignore-scripts
      - run: node scripts/backup-contract/generate-cases.cjs --check
      - run: node --test scripts/backup-contract/contract.test.cjs harmonyos/tests/*.test.cjs
        env:
          FLASH_TYPESCRIPT_PATH: ${{ github.workspace }}/scripts/backup-contract/node_modules/typescript
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --console=plain
        working-directory: android
  android-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild test -scheme Flash -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: macos
